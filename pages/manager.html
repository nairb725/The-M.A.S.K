<!doctype html>
<html class="scrollable">
	<head>
		<meta name="viewport" content="width=device-width,initial-scale=1.0" />
		<title>The M.A.S.K - Sbire</title>
		<link rel="stylesheet" href="../styles/style.css" />
		<style>
			#playerList {
				list-style: none;
				padding: 0;
				display: flex;
				flex-wrap: wrap;
				justify-content: flex-start;
			}

			#playerList li {
				background-color: #2d2d2d;
				margin: 5px calc(10% / 18.5);
				padding: 15px;
				border-radius: 5px;
				border-left: 4px solid #ff6b6b;
				width: 17%;
				display: flex;
				justify-content: space-between;
			}
		</style>
	</head>
	<body>
		<div class="header master">
			<div>
				<button onclick="openPopup()" style="border-radius: 50px">QR Code</button>
			</div>
			<div style="flex: 6">
				<h1>🎭 The M.A.S.K - Sbire</h1>
				<h2>Sbire connectés: <span id="playerCount">0</span></h2>
			</div>
			<h2>
				Objectif: <br />
				<span id="current-objective">1500</span> / 1500
			</h2>
		</div>
		<div class="flex-center">
			<button id="start-button" onclick="start()">Start !</button>
		</div>
		<ul id="playerList"></ul>

		<div class="popup hidden" id="popup-qr-code" onclick="openPopup()">
			<div class="popup-container">
				<img src="../img/QRCode.png" />
				<h2>Join The M.A.S.K.</h2>
			</div>
		</div>

		<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
		<script>
			const socket = io();
			const playerListElement = document.getElementById("playerList");
			const playerCountElement = document.getElementById("playerCount");
			const popup = document.getElementById("popup-qr-code");

			const currentObjectiveElt = document.getElementById("current-objective");
			let objective = currentObjectiveElt.innerText;

			const openPopup = () => {
				popup.classList.toggle("hidden");
			};

			socket.on("updatePlayerList", (players) => {
				playerListElement.innerHTML = "";
				playerCountElement.textContent = players.length;

				players.forEach((player) => {
					const li = document.createElement("li");
					li.id = player.id;
					li.innerHTML = `<div id="${player.id}-name">${player.name}</div><div id="${player.id}-score">${player.score}</div>`;

					playerListElement.appendChild(li);
				});
			});

			socket.on("updatePlayerScore", (player) => {
				const e = document.getElementById(`${player.id}-score`);
				const oldValue = e.innerText;
				e.innerText = player.score;

				objective = objective - (player.score - oldValue);

				currentObjectiveElt.innerText = objective;
			});

			socket.on("endGame", (currentDate) => {
				objective = 1500;
				currentObjectiveElt.innerText = objective;
			});

			const start = () => {
				socket.emit("start");
			};
		</script>
	</body>
</html>
