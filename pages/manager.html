<!doctype html>
<html>
	<head>
		<meta name="viewport" content="width=device-width,initial-scale=1.0" />
		<title>The M.A.S.K - Minions</title>
		<link rel="stylesheet" href="../styles/style.css" />
		<style>
			#playerList {
				list-style: none;
				padding: 0;
			}

			#playerList li {
				background-color: #2d2d2d;
				margin: 10px 0;
				padding: 15px;
				border-radius: 5px;
				border-left: 4px solid #ff6b6b;
			}
		</style>
	</head>
	<body>
		<div class="header">
			<div>
				<h1>🎭 Minions de The M.A.S.K</h1>
				<h2>Minions connectés: <span id="playerCount">0</span></h2>
			</div>
			<button onclick="openPopup()" style="border-radius: 50px">QR Code</button>
		</div>
		<ul id="playerList"></ul>

		<div class="popup hidden" id="popup-qr-code" onclick="openPopup()">
			<div class="popup-container">
				<img src="../img/QRCode.png" />
				<h2>Join The M.A.S.K.</h2>
			</div>
		</div>

		<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
		<script>
			const socket = io();
			const playerListElement = document.getElementById("playerList");
			const playerCountElement = document.getElementById("playerCount");
			const popup = document.getElementById("popup-qr-code");

			const openPopup = () => {
				popup.classList.toggle("hidden");
			};

			socket.on("updatePlayerList", (players) => {
				playerListElement.innerHTML = "";
				playerCountElement.textContent = players.length;

				players.forEach((playerName) => {
					const li = document.createElement("li");
					li.textContent = playerName;

					playerListElement.appendChild(li);
				});
			});
		</script>
	</body>
</html>
