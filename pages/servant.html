<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="../styles/style.css" />
		<title>Document</title>
	</head>
	<body>
		<img src="../img/crepe.png" alt="" id="krep" />
	</body>

	<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
	<script>
		const socket = io();
		let img = document.getElementById("krep");

		const urlParams = new URLSearchParams(window.location.search);
		const name = urlParams.get("name");
		socket.emit("playerName", name);

		document.addEventListener("click", function (e) {
			console.log("test");
			const randomSign = () => Math.sign(Math.random() - 0.5);
			let randAngle = Math.floor(Math.random() * 10) * randomSign(); // random degrees

			let randPosX = Math.random() * 2 * randomSign();
			let randPosY = Math.random() * 2 * randomSign();
			img.style.transform = "rotate(" + randAngle + "deg) translate(" + randPosX + "%, " + randPosY + "%)";
		});
	</script>
</html>
