<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="../styles/style.css" />
	<title>Document</title>
</head>
<div class="banner blur" id="banner" style="display: block">
	<div class="banner-container"> Waiting for other minions</div>
</div>
</div>

<body class="center">
	<style>
		body {
			margin: 0;
			height: 100vh;
			background: #1e1e1e;
			overflow: hidden;
		}

		.crepe-container {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			pointer-events: none;
		}

		.crepe,
.crepeGiraffetkt {
  position: absolute;
  top: -10%;
  width: 80px;
  height: 80px;
  background-position: center;
  background-size: contain;
  background-repeat: no-repeat;
  opacity: 0.9;

}

.crepe {
  background-image: url("../img/crepe1.png");
}

.crepeGiraffetkt {
  background-image: url("../img/crepeGiraffe1.png");
}

.falling .crepe,
.falling .crepeGiraffetkt {
  animation: fall linear infinite;
}

		.crepeGiraffetkt:nth-child(1) {
			left: 3%;
			animation-duration: 0.7s;
			transform: scale(0.6);
		}

		.crepe:nth-child(2) {
			left: 9%;
			animation-duration: 1.9s;
			transform: scale(1.15);
		}

		.crepe:nth-child(3) {
			left: 14%;
			animation-duration: 1.2s;
			transform: scale(0.9);
		}

		.crepe:nth-child(4) {
			left: 21%;
			animation-duration: 2.3s;
			transform: scale(0.5);
		}

		.crepeGiraffetkt:nth-child(5) {
			left: 27%;
			animation-duration: 0.9s;
			transform: scale(1.3);
		}

		.crepe:nth-child(6) {
			left: 33%;
			animation-duration: 1.6s;
			transform: scale(0.75);
		}

		.crepe:nth-child(7) {
			left: 38%;
			animation-duration: 2.1s;
			transform: scale(1.05);
		}

		.crepeGiraffetkt:nth-child(8) {
			left: 44%;
			animation-duration: 1.4s;
			transform: scale(0.65);
		}

		.crepe:nth-child(9) {
			left: 51%;
			animation-duration: 2.5s;
			transform: scale(1.4);
		}

		.crepe:nth-child(10) {
			left: 57%;
			animation-duration: 0.6s;
			transform: scale(0.85);
		}

		.crepeGiraffetkt:nth-child(11) {
			left: 63%;
			animation-duration: 1.8s;
			transform: scale(1.2);
		}

		.crepe:nth-child(12) {
			left: 69%;
			animation-duration: 1.1s;
			transform: scale(0.55);
		}

		.crepeGiraffetkt:nth-child(13) {
			left: 75%;
			animation-duration: 2.0s;
			transform: scale(0.95);
		}

		.crepe:nth-child(14) {
			left: 81%;
			animation-duration: 1.3s;
			transform: scale(1.35);
		}

		.crepe:nth-child(15) {
			left: 88%;
			animation-duration: 2.4s;
			transform: scale(0.7);
		}

		.crepeGiraffetkt:nth-child(16) {
			left: 94%;
			animation-duration: 0.8s;
			transform: scale(1.1);
		}

		@keyframes fall {
			0% {
				transform: translateY(-10vh) rotate(0deg);
			}

			100% {
				transform: translateY(110vh) rotate(360deg);
			}
		}
	</style>
	<div class="crepe-container" id="crepeContainer">
		<span class="crepeGiraffetkt"></span>
		<span class="crepe"></span>
		<span class="crepe"></span>
		<span class="crepe"></span>
		<span class="crepeGiraffetkt"></span>
		<span class="crepe"></span>
		<span class="crepe"></span>
		<span class="crepe"></span>
		<span class="crepeGiraffetkt"></span>
		<span class="crepe"></span>
		<span class="crepeGiraffetkt"></span>
		<span class="crepe"></span>
		<span class="crepeGiraffetkt"></span>
		<span class="crepe"></span>
		<span class="crepe"></span>
		<span class="crepeGiraffetkt"></span>
	</div>

	<img src="../img/crepe1.png" alt="" id="krep" />
</body>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
	const socket = io();
	let img = document.getElementById("krep");
	let crepeStatus = 1;
	let crepeTotal;
	let crepeGiraffeProba = false;
	let isplaying = false;
	let banner = document.getElementById('banner')

	//check if we are playing and hide the banner
	setInterval(function () {
		if (isplaying == true) {
			banner.style.display = 'none';
		}
	}, 1000);

	const urlParams = new URLSearchParams(window.location.search);
	const name = urlParams.get("name");
	socket.emit("playerName", name);

	function click() {
		if (isplaying === true) {

			crepeContainer.classList.add("falling");

			crepeStatus++;

			if (crepeStatus > 4) {
				crepeTotal++;
				socket.emit("addScore");
				crepeStatus = 1;
				crepeGiraffeProba = Math.random() < 1 / 8;
			}

			img.src = crepeGiraffeProba
				? "../img/crepeGiraffe" + crepeStatus + ".png"
				: "../img/crepe" + crepeStatus + ".png";

			const randomSign = () => (Math.random() < 0.5 ? -1 : 1);
			const randAngle = Math.floor(Math.random() * 10) * randomSign();
			const randPosX = Math.random() * 2 * randomSign();
			const randPosY = Math.random() * 2 * randomSign();

			img.style.transform =
				`rotate(${randAngle}deg) translate(${randPosX}%, ${randPosY}%)`;
		} else {

		}

	}

	socket.on("startGame", () => {
		isplaying = true;
	});
	socket.on("endGame", (currentDate) => {
		isplaying = false;
		window.location.href("/stats?id=" + socket.id + "&currentDate=" + currentDate);
	});

	document.addEventListener("click", click);
</script>

</html>
