<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="../styles/style.css" />
		<link rel="stylesheet" href="../styles/crepes.css" />
		<title>Document</title>
		<style>
			body {
				margin: 0;
			}
		</style>
	</head>
	<div class="banner blur" id="banner" style="display: block">
		<div class="banner-container">Waiting for other minions</div>
	</div>

	<body class="center">
		<div class="crepe-container" id="crepeContainer">
			<span class="crepeGiraffetkt"></span>
			<span class="crepe"></span>
			<span class="crepe"></span>
			<span class="crepe"></span>
			<span class="crepeGiraffetkt"></span>
			<span class="crepe"></span>
			<span class="crepe"></span>
			<span class="crepe"></span>
			<span class="crepeGiraffetkt"></span>
			<span class="crepe"></span>
			<span class="crepeGiraffetkt"></span>
			<span class="crepe"></span>
			<span class="crepeGiraffetkt"></span>
			<span class="crepe"></span>
			<span class="crepe"></span>
			<span class="crepeGiraffetkt"></span>
		</div>

		<div class="score-container">Score: <span id="self-score"> 0 </span></div>

		<!-- Load all images beforehand to prevent the client from requesting all of them to the server -->
		<img src="../img/crepe1.png" alt="" id="krep1" />
		<img src="../img/crepe2.png" alt="" id="krep2" class="hidden" />
		<img src="../img/crepe3.png" alt="" id="krep3" class="hidden" />
		<img src="../img/crepe4.png" alt="" id="krep4" class="hidden" />
		<img src="../img/crepeGiraffe1.png" alt="" id="krepG1" class="hidden" />
		<img src="../img/crepeGiraffe2.png" alt="" id="krepG2" class="hidden" />
		<img src="../img/crepeGiraffe3.png" alt="" id="krepG3" class="hidden" />
		<img src="../img/crepeGiraffe4.png" alt="" id="krepG4" class="hidden" />
	</body>
	<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
	<script>
		const socket = io();
		let scoreElt = document.getElementById("self-score");
		let crepeTotal = 0;
		let crepeGiraffeProba = false;
		let isplaying = false;
		let banner = document.getElementById("banner");

		let img1 = document.getElementById("krep1");
		let img2 = document.getElementById("krep2");
		let img3 = document.getElementById("krep3");
		let img4 = document.getElementById("krep4");
		let animCrepe = [img1, img2, img3, img4];

		let imgG1 = document.getElementById("krepG1");
		let imgG2 = document.getElementById("krepG2");
		let imgG3 = document.getElementById("krepG3");
		let imgG4 = document.getElementById("krepG4");
		let animCrepeG = [imgG1, imgG2, imgG3, imgG4];

		let indexAnim = 0;

		//check if we are playing and hide the banner
		setInterval(function () {
			if (isplaying == true) {
				banner.style.display = "none";
			}
		}, 1000);

		function click() {
			if (!isplaying) return;

			crepeContainer.classList.add("falling");

			indexAnim++;

			if (indexAnim > 3) {
				crepeTotal++;
				socket.emit("addScore");
				scoreElt.innerText = crepeTotal;
				indexAnim = 0;
				crepeGiraffeProba = Math.random() < 1 / 8;
			}

			animCrepe.concat(animCrepeG).forEach((e) => e.classList.add("hidden"));
			const imgToLoad = crepeGiraffeProba ? animCrepeG[indexAnim] : animCrepe[indexAnim];
			imgToLoad.classList.remove("hidden");

			const randomSign = () => (Math.random() < 0.5 ? -1 : 1);
			const randAngle = Math.floor(Math.random() * 10) * randomSign();
			const randPosX = Math.random() * 2 * randomSign();
			const randPosY = Math.random() * 2 * randomSign();

			imgToLoad.style.transform = `rotate(${randAngle}deg) translate(${randPosX}%, ${randPosY}%)`;
		}

		const urlParams = new URLSearchParams(window.location.search);
		const name = urlParams.get("name");
		socket.emit("playerName", name);

		socket.on("startGame", () => {
			isplaying = true;
		});
		socket.on("endGame", (currentDate) => {
			isplaying = false;
			window.location.href = "/stats?id=" + socket.id + "&currentDate=" + currentDate;
		});

		document.addEventListener("click", click);
	</script>
</html>
