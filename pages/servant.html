<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="../styles/style.css" />
		<title>Document</title>
	</head>
	<div class="banner blur" id="banner"  style="display: block">
		<div class="banner-container"> Waiting for other minions</div>
		</div>
	</div>
	<body class="center">
		<img src="../img/crepe1.png" alt="" id="krep" />
	</body>
	<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
	const socket = io();
	let img = document.getElementById("krep");
	let crepeStatus = 1;
	let crepeTotal;
	let crepeGiraffeProba = false;
	let isplaying = false;
	let banner = document.getElementById('banner')

	//check if we are playing and hide the banner
	setInterval(function () {
		if(isplaying == true){
			banner.style.display = 'none';
		}
	}, 1000);

	const urlParams = new URLSearchParams(window.location.search);
	const name = urlParams.get("name");
	socket.emit("playerName", name);

	function click() {
		if(isplaying == true){
			crepeStatus++;

		if (crepeStatus > 4) {
			crepeTotal ++;
			socket.emit("addScore");
			crepeStatus = 1;
			crepeGiraffeProba = Math.random() < 1 / 8;
		}

		img.src = crepeGiraffeProba
			? "../img/crepeGiraffe" + crepeStatus + ".png"
			: "../img/crepe" + crepeStatus + ".png";
			console.log(img.src);

		const randomSign = () => (Math.random() < 0.5 ? -1 : 1);
		const randAngle = Math.floor(Math.random() * 10) * randomSign();
		const randPosX = Math.random() * 2 * randomSign();
		const randPosY = Math.random() * 2 * randomSign();

		img.style.transform =
			`rotate(${randAngle}deg) translate(${randPosX}%, ${randPosY}%)`;
		} else{

		}
		
	}
	
	socket.on("startGame", ()=> {
		isplaying = true;
	});
	socket.on("endGame", ()=> {
		isplaying = false;
		window.location.href("stat.html");
	});

	document.addEventListener("click", click);
</script>
</html>
